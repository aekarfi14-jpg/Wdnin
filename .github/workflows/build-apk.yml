name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build WDNIN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android
          chmod +x ./android/gradlew

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Set WDNIN launcher icon
        run: |
          set -e
          ICON_SOURCE="public/assets/images/wdnin.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "::error::Launcher icon not found: $ICON_SOURCE"
            exit 1
          fi
          RES="android/app/src/main/res"
          echo "Removing all Capacitor generated launcher icons..."
          find "$RES" -type f \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" -o -name "ic_launcher.xml" -o -name "ic_launcher_round.xml" \) -delete
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          generate_icon() {
            SIZE=$1
            OUT=$2
            convert "$ICON_SOURCE" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "$OUT"
          }
          generate_icon 48 "$RES/mipmap-mdpi/ic_launcher.png"
          generate_icon 48 "$RES/mipmap-mdpi/ic_launcher_round.png"
          generate_icon 72 "$RES/mipmap-hdpi/ic_launcher.png"
          generate_icon 72 "$RES/mipmap-hdpi/ic_launcher_round.png"
          generate_icon 96 "$RES/mipmap-xhdpi/ic_launcher.png"
          generate_icon 96 "$RES/mipmap-xhdpi/ic_launcher_round.png"
          generate_icon 144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          generate_icon 144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          generate_icon 192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          generate_icon 192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          echo "Launcher icon generation complete."

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify and Prepare WDNIN.apk Artifact
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No Android APK file was generated by Gradle!"
            exit 1
          fi
          echo "Found generated APK at: $APK_PATH"
          cp "$APK_PATH" build-output/WDNIN.apk
          echo "Successfully created build-output/WDNIN.apk"
          ls -lh build-output/WDNIN.apk

      - name: Upload WDNIN.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDNIN.apk
          path: build-output/WDNIN.apk
          if-no-files-found: error
          retention-days: 30
